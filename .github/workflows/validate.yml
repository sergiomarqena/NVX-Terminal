name: Validate NORDVEX Screener
on:
  push:
    branches: [screener-build]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check public/bg.js
      - run: node --check public/chart.js
      - run: node --check public/sound.js
      - run: node --check alerts.js
      - run: node --check public/alerts.js
      - run: node --check public/pwa.js
      - run: node --check public/sw.js
